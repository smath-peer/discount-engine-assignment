<svg width="1280" height="700" viewBox="0 0 1280 700" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Discount Engine architecture</title>
<desc id="desc">Three input paths feed one pricing engine. A cart file (CSV or PDF) is read by cartLoad, which detects the format and uses csvParser or the PDF reader; every row passes the same strict cartItemValidator, and the cart is replaced (with Undo) only when rows are usable. A rules CSV is read by rulesLoad and csvParser and checked by discountRuleValidator, with duplicates skipped. A plain-language offer is sent by parseRuleClient to the server endpoint api/parse-rule, which calls Groq with the sentence only, grounds every field against the sentence and validates the rule; the user reviews, can edit and must confirm it. Manual entry starts at the review card. Active rules and the cart feed priceCart in src/engine/discountEngine.js, whose results appear in the checkout summary and in the offer comparison, which is a preview only.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#131A48"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5A5A5A"/></marker>
</defs>
