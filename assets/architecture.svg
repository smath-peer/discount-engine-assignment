<!-- box text: titles -->
<g font-size="14" font-weight="700" fill="#131A48">
<text x="56" y="180">Cart file</text>
<text x="256" y="159">cartLoad.js<tspan font-weight="400" fill="#5A5A5A">  detects CSV or PDF</tspan></text>
<text x="254" y="207">csvParser.js</text>
<text x="368" y="207">PDF reader</text>
<text x="536" y="170">cartItemValidator.js</text>
<text x="786" y="170">Cart</text>

<text x="56" y="300">Rules file</text>
<text x="256" y="300">rulesLoad.js → csvParser.js</text>
<text x="536" y="300">discountRuleValidator.js</text>
<text x="786" y="300">Active rules</text>

<text x="56" y="430">Plain-language offer</text>
<text x="256" y="430">parseRuleClient.js</text>
<text x="536" y="430">Review card</text>

<text x="256" y="548">api/parse-rule  ·  server</text>
<text x="1026" y="545">Checkout summary</text>
<text x="1026" y="617">Offer comparison</text>
</g>

<!-- box text: details -->
<g font-size="12" fill="#5A5A5A">
<text x="56" y="200">cart.csv or cart.pdf</text>
<text x="254" y="225">CSV rows</text>
<text x="368" y="225">pdf/readPdfText.js</text>
<text x="368" y="241">→ pdfCartParser.js</text>
<text x="536" y="192">one strict check for every</text>
<text x="536" y="210">CSV and PDF row</text>
<text x="786" y="192">replaced only when rows</text>
<text x="786" y="210">are usable  ·  Undo</text>

<text x="56" y="320">rules.csv</text>
<text x="256" y="320">bad rows skipped, with reasons</text>
<text x="536" y="320">same terms twice are skipped</text>
<text x="786" y="322">CSV offers</text>
<text x="786" y="342">+ offers confirmed here</text>
<text x="786" y="370">Undo after an upload</text>
<text x="786" y="390">Remove (with Undo)</text>
<text x="786" y="418">a duplicate offer</text>
<text x="786" y="436">cannot be added</text>

<text x="56" y="450">or Enter manually</text>
<text x="56" y="464">(no AI request)</text>
<text x="256" y="450">sends only the sentence</text>
<text x="536" y="448">preview  ·  Edit details  ·  Confirm</text>
<text x="536" y="464">manual entry starts here</text>

<text x="256" y="570">Groq (openai/gpt-oss-20b); the API key stays on the server</text>
<text x="256" y="590">groundRule.js checks every field against the sentence,</text>
<text x="256" y="606">then discountRuleValidator.js. Unclear text → a question.</text>

<text x="1026" y="565">prices, savings, amount to pay</text>
<text x="1026" y="637">preview only: never changes the result</text>
</g>

<!-- engine text -->
<g fill="#FFFFFF">
<text x="1030" y="166" font-size="16" font-weight="700">discountEngine.js</text>
<text x="1030" y="186" font-size="12" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#DDDEE4">priceCart(cart, rules)</text>
<text x="1030" y="224" font-size="13" font-weight="700" fill="#FF5800">1  Item offers</text>
<text x="1030" y="244" font-size="12">Best non-stackable offer wins;</text>
<text x="1030" y="262" font-size="12">stackable offers apply in order.</text>
<text x="1030" y="298" font-size="13" font-weight="700" fill="#FF5800">2  Cart offer</text>
<text x="1030" y="318" font-size="12">On the discounted subtotal;</text>
<text x="1030" y="336" font-size="12">the minimum is inclusive.</text>
<text x="1030" y="396" font-size="12" fill="#DDDEE4">Pure functions: no files,</text>
<text x="1030" y="414" font-size="12" fill="#DDDEE4">network or UI code. New input</text>
<text x="1030" y="432" font-size="12" fill="#DDDEE4">modes never change this file.</text>
</g>

